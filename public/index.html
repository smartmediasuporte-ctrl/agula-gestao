        <span class="empresa-dot" style="background:${emp.cor}"></span> ${emp.nome}
      </div>`;

    if (empDone.length > 0) {
      html += `<ul class="fechamento-list done">${empDone.map(t => `<li>${t.titulo}</li>`).join('')}</ul>`;
    }
    if (empPending.length > 0) {
      html += `<div style="margin-top:8px;font-size:11px;color:#facc15;font-weight:600">PENDENTES</div>
        <ul class="fechamento-list pending">${empPending.map(t => `<li>${t.titulo}</li>`).join('')}</ul>`;
    }

    html += '</div>';
  });

  if (week.diagnostico) {
    html += `<div class="diagnostico-area"><h4>Diagnóstico</h4><p style="font-size:14px;color:var(--text-secondary);white-space:pre-wrap">${week.diagnostico}</p></div>`;
  }

  html += '</div>';
  return html;
}

function viewWeekHistory(weekId) {
  viewingWeekHistory = weekId;
  render();
}

// ── Task Item Component ──
// ── Partido Novo — Render by Operational Areas ──
function renderPartidoNovoAreas(tasks) {
  const flags = getPNFlags(tasks);
  const priorities = getPNPriorities(tasks);
  let html = '';

  // Financial Dashboard — R$ 2.500/mês fixo desde janeiro 2026
  const pnStartMonth = new Date(2026, 0, 1); // janeiro 2026
  const now = new Date();
  const mesesDecorridos = (now.getFullYear() - pnStartMonth.getFullYear()) * 12 + (now.getMonth() - pnStartMonth.getMonth()) + 1;
  const meses = Math.max(1, mesesDecorridos);
  const salarioMensal = 2500;
  const totalAcumulado = meses * salarioMensal;
  const mesesLabels = [];
  for (let i = 0; i < meses; i++) {
    const d = new Date(pnStartMonth.getFullYear(), pnStartMonth.getMonth() + i, 1);
    mesesLabels.push(d.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }));
  }

  html += `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px">
    <div style="font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px">&bull; Financeiro</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px">
      <div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:#4ade80">${formatBRL(totalAcumulado)}</div>
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px">Total Acumulado</div>
      </div>
      <div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:#60a5fa">${formatBRL(salarioMensal)}</div>
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px">Fixo / Mês</div>
      </div>
      <div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:#facc15">${meses}</div>
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px">Meses</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${mesesLabels.map((m, i) => `<div style="background:var(--bg);border-radius:6px;padding:6px 10px;font-size:11px;display:flex;align-items:center;gap:6px;border:1px solid var(--border)">
        <span style="color:var(--text-muted)">${m}</span>
        <span style="font-weight:700;color:#4ade80">${formatBRL(salarioMensal)}</span>
        <span style="font-size:9px;color:var(--text-muted)">= ${formatBRL((i + 1) * salarioMensal)}</span>
      </div>`).join('')}
    </div>
  </div>`;

  // Mensagem do Dia — WhatsApp Groups
  const msgDia = localStorage.getItem('pn_mensagem_dia') || '';
  const msgDiaData = localStorage.getItem('pn_mensagem_dia_data') || '';
  const hoje = new Date().toISOString().slice(0,10);
  const msgAtualizada = msgDiaData === hoje;
  html += `<div style="background:var(--bg-card);border:1px solid ${msgAtualizada ? '#25D366' : 'var(--border)'};border-radius:var(--radius);padding:18px 20px;margin-bottom:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-family:var(--font-sans);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:8px">
        <span style="color:#25D366">&bull;</span> Mensagem do Dia — WhatsApp
        ${msgAtualizada ? '<span style="font-size:9px;padding:2px 6px;border:1px solid #25D366;color:#25D366;border-radius:2px;font-family:var(--font-mono)">ENVIADA HOJE</span>' : '<span style="font-size:9px;padding:2px 6px;border:1px solid var(--warning);color:var(--warning);border-radius:2px;font-family:var(--font-mono)">PENDENTE</span>'}
      </div>
      <button class="btn btn-primary" onclick="openPNMensagemModal()" style="font-size:11px;padding:4px 10px">${msgAtualizada ? 'Editar' : '+ Definir'} Mensagem</button>
    </div>
    ${msgDia ? `<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--text);position:relative">${msgDia}<button onclick="navigator.clipboard.writeText(document.getElementById('pnMsgTexto')?.textContent || '${msgDia.replace(/'/g,"\\'")}');toast('Copiado!')" style="position:absolute;top:8px;right:8px;background:var(--accent);color:#000;border:none;padding:4px 8px;border-radius:var(--radius-sm);font-size:10px;cursor:pointer;font-family:var(--font-mono)">COPIAR</button></div>` : '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">Defina a mensagem do dia para os grupos de filiados</div>'}
  </div>`;

  // Filiados — Alertas recorrentes
  const daysSinceLastCheck = Math.floor((Date.now() - parseInt(localStorage.getItem('pn_filiados_check') || '0')) / 86400000);
  const daysSinceCobranca = Math.floor((Date.now() - parseInt(localStorage.getItem('pn_inadimplentes_check') || '0')) / 86400000);
  const precisaCheckFiliados = daysSinceLastCheck >= 1;
  const precisaCobranca = daysSinceCobranca >= 3;
  if (precisaCheckFiliados || precisaCobranca) {
    html += '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">';
    if (precisaCheckFiliados) {
      html += `<div style="flex:1;min-width:200px;background:rgba(255,184,0,0.06);border:1px solid rgba(255,184,0,0.3);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-size:12px;font-weight:600;color:var(--warning)">Verificar novos filiados</div><div style="font-size:10px;color:var(--text-muted);margin-top:2px">Confira se houve filia&ccedil;&otilde;es novas e fa&ccedil;a o convite para os grupos</div></div>
        <button class="btn" onclick="localStorage.setItem('pn_filiados_check',Date.now().toString());render();toast('Verificado!')" style="font-size:10px;padding:4px 8px;white-space:nowrap">Feito</button>
      </div>`;
    }
    if (precisaCobranca) {
      html += `<div style="flex:1;min-width:200px;background:rgba(255,68,68,0.06);border:1px solid rgba(255,68,68,0.3);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-size:12px;font-weight:600;color:var(--danger)">Cobran&ccedil;a de inadimplentes</div><div style="font-size:10px;color:var(--text-muted);margin-top:2px">&Uacute;ltima cobran&ccedil;a: ${daysSinceCobranca} dias atr&aacute;s (ciclo: 3 dias)</div></div>
        <button class="btn" onclick="localStorage.setItem('pn_inadimplentes_check',Date.now().toString());render();toast('Cobran&ccedil;a registrada!')" style="font-size:10px;padding:4px 8px;white-space:nowrap">Feito</button>
      </div>`;
    }
    html += '</div>';
  }

  // Weekly Priorities Panel
  if (priorities.length > 0) {
    html += `<div class="pn-priorities">
      <div class="pn-priorities-title">Prioridades da Semana</div>
      ${priorities.map(p => {
        const area = getPNArea(p.area);
        return `<div class="pn-priority-item">
          <span class="pn-priority-urgency pn-urgency-${p.urgency}">${p.urgency === 'high' ? 'URGENTE' : p.urgency === 'medium' ? 'ATENÇÃO' : 'NORMAL'}</span>
          <span style="flex:1">${p.task.titulo}</span>
          <span style="font-size:11px;color:var(--text-muted)">${p.reason}</span>
          ${area ? `<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${area.cor}22;color:${area.cor}">${area.icon}</span>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }

  // Render each area
  html += '<div class="pn-areas">';
  PN_AREAS.forEach(area => {
    const areaTasks = tasks.filter(t => classifyPNTask(t) === area.id);
    const unclassified = tasks.filter(t => !classifyPNTask(t));
    const pending = areaTasks.filter(t => t.status === 'pendente');
    const inProgress = areaTasks.filter(t => t.status === 'em_andamento');
    const done = areaTasks.filter(t => t.status === 'concluido');
    const blocked = areaTasks.filter(t => t.status === 'bloqueado');
    const areaFlags = flags.filter(f => f.area === area.id);
    const expanded = pnExpandedAreas[area.id] !== false;

    html += `<div class="pn-area-card">
      <div class="pn-area-header" style="--pn-area-color:${area.cor}" onclick="togglePNArea('${area.id}')">
        <div class="pn-area-title">
          <span class="area-icon">${area.icon}</span>
          ${area.nome}
          ${areaFlags.some(f => f.type === 'red') ? '<span style="color:#f87171;font-size:12px">●</span>' : ''}
          ${areaFlags.some(f => f.type === 'yellow') && !areaFlags.some(f => f.type === 'red') ? '<span style="color:#fbbf24;font-size:12px">●</span>' : ''}
        </div>
        <div class="pn-area-badges">
          ${pending.length > 0 ? `<span class="pn-badge pn-badge-pending">${pending.length} pend.</span>` : ''}
          ${inProgress.length > 0 ? `<span class="pn-badge pn-badge-progress">${inProgress.length} and.</span>` : ''}
          ${done.length > 0 ? `<span class="pn-badge pn-badge-done">${done.length} ✓</span>` : ''}
          ${blocked.length > 0 ? `<span class="pn-badge" style="background:rgba(239,68,68,0.12);color:#f87171">${blocked.length} bloq.</span>` : ''}
          <span style="font-size:16px;color:var(--text-muted);transition:transform 0.2s;${expanded ? '' : 'transform:rotate(-90deg)'}"">▾</span>
        </div>
      </div>
      <div class="pn-area-body ${expanded ? '' : 'collapsed'}">
        <div style="font-size:11px;color:var(--text-muted);padding:10px 0 6px">${area.desc}</div>`;

    // Flags for this area
    areaFlags.forEach(f => {
      html += `<div class="pn-flag pn-flag-${f.type}">
        <span class="pn-flag-icon">${f.type === 'red' ? '&bull;' : '&bull;'}</span>
        ${f.msg}
      </div>`;
    });

    // Tasks grouped: pendente → em_andamento → bloqueado → concluido
    const statusOrder = [
      { key: 'pendente', tasks: pending },
      { key: 'em_andamento', tasks: inProgress },
      { key: 'bloqueado', tasks: blocked },
      { key: 'concluido', tasks: done },
    ];

    statusOrder.forEach(group => {
      if (group.tasks.length === 0) return;
      html += `<div style="margin-top:10px">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">${statusLabel(group.key)} (${group.tasks.length})</div>
        ${group.tasks.map(t => renderTaskItem(t, true)).join('')}
      </div>`;
    });

    if (areaTasks.length === 0) {
      html += `<div style="padding:12px 0;text-align:center;color:var(--text-muted);font-size:12px">Nenhuma tarefa nesta área</div>`;
    }

    html += `<button class="pn-add-area-btn" onclick="openTaskModal('partido_novo','${area.id}')">+ Nova tarefa em ${area.nome}</button>`;
    html += '</div></div>';
  });

  // Unclassified tasks
  const unclassified = tasks.filter(t => !classifyPNTask(t));
  if (unclassified.length > 0) {
    const expanded = pnExpandedAreas['sem_area'] !== false;
    html += `<div class="pn-area-card">
      <div class="pn-area-header" style="--pn-area-color:var(--text-muted)" onclick="togglePNArea('sem_area')">
        <div class="pn-area-title">
          <span class="area-icon">&bull;</span>
          Sem Área Definida
        </div>
        <div class="pn-area-badges">
          <span class="pn-badge pn-badge-count">${unclassified.length}</span>
          <span style="font-size:16px;color:var(--text-muted);transition:transform 0.2s;${expanded ? '' : 'transform:rotate(-90deg)'}"">▾</span>
        </div>
      </div>
      <div class="pn-area-body ${expanded ? '' : 'collapsed'}">
        ${unclassified.map(t => renderTaskItem(t, true)).join('')}
      </div>
    </div>`;
  }

  html += '</div>';
  return html;
}

function togglePNArea(areaId) {
  pnExpandedAreas[areaId] = pnExpandedAreas[areaId] === false ? true : false;
  render();
}

function renderTaskItem(task, showEmpresa) {
  const emp = getEmpresa(task.empresa_id);
  const isChecked = task.status === 'concluido';

  return `<div class="task-item">
    <div class="task-checkbox ${isChecked ? 'checked' : ''}" onclick="toggleTask('${task.id}')"></div>
    <div class="task-content">
      <div class="task-title ${isChecked ? 'done' : ''}">${task.titulo}</div>
      <div class="task-meta">
        ${showEmpresa === false && emp ? `<span class="task-empresa-tag" style="background:${emp.cor}">${emp.nome}</span>` : ''}
        <span class="task-status-tag status-${task.status}">${statusLabel(task.status)}</span>
        ${task.prazo ? `<span class="task-prazo ${new Date(task.prazo + 'T23:59:59') < new Date() && !isChecked ? 'vencido' : ''}">${new Date(task.prazo + 'T12:00').toLocaleDateString('pt-BR', {day:'2-digit',month:'short'})}</span>` : ''}
        ${task.semanas_acumuladas >= 2 && !isChecked ? `<span class="task-stuck">${task.semanas_acumuladas} semanas</span>` : ''}
        ${task.observacao ? `<span class="task-obs">${task.observacao}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-action-btn" onclick="cycleStatus('${task.id}')" title="Mudar status">↻</button>
      <button class="task-action-btn" onclick="openEditTaskModal('${task.id}')" title="Editar">&starf;</button>
      <button class="task-action-btn" onclick="deleteTask('${task.id}')" title="Excluir">&times;</button>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
// CONSELHO DIGITAL — RENDER
// ══════════════════════════════════════════════════════════
function renderConselho() {
  let html = '<div class="fade-in">';
  html += `<div class="page-header">
    <div>
      <div class="page-title" style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px">&loz;</span> Conselho Digital NOVO DF
      </div>
      <div class="page-subtitle">Programa de pré-candidatos — Acompanhamento completo</div>
    </div>
  </div>`;

  // Internal tabs
  const tabs = [
    { id: 'agenda', label: 'Agenda da Semana' },
    { id: 'candidatos', label: 'Candidatos' },
    { id: 'acompanhamento', label: 'Acompanhamento Mensal' },
    { id: 'tarefas_op', label: 'Tarefas da Opera\u00e7\u00e3o' },
    { id: 'relatorio', label: 'Relat\u00f3rio ao Diret\u00f3rio' },
  ];

  html += '<div class="conselho-tabs">';
  tabs.forEach(t => {
    html += `<button class="conselho-tab ${conselhoSubPage === t.id ? 'active' : ''}" onclick="setConselhoTab('${t.id}')">${t.label}</button>`;
  });
  html += '</div>';

  switch (conselhoSubPage) {
    case 'agenda': html += renderConselhoAgenda(); break;
    case 'candidatos': html += renderConselhoCandidatos(); break;
    case 'acompanhamento': html += renderConselhoAcompanhamento(); break;
    case 'tarefas_op': html += renderConselhoTarefas(); break;
    case 'relatorio': html += renderConselhoRelatorio(); break;
  }

  html += '</div>';
  return html;
}

function setConselhoTab(tab) {
  conselhoSubPage = tab;
  render();
}

// ── 1. AGENDA DA SEMANA ──
function renderConselhoAgenda() {
  const agendamentos = loadConselhoAgendamentos();
  const candidatos = loadConselhoCandidatos();
  const weekAgendas = agendamentos.filter(a => a.semana === DATA.currentWeek);

  const total = weekAgendas.length;
  const realizados = weekAgendas.filter(a => a.status === 'realizado').length;
  const pendentes = weekAgendas.filter(a => a.status === 'agendado').length;
  const remarcados = weekAgendas.filter(a => a.status === 'remarcado').length;
  const faltou = weekAgendas.filter(a => a.status === 'faltou').length;

  let html = `<div class="conselho-counter-row">
    <div class="conselho-counter"><div class="c-val">${total}</div><div class="c-label">Total Agendados</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#4ade80">${realizados}</div><div class="c-label">Realizados</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#60a5fa">${pendentes}</div><div class="c-label">Pendentes</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#facc15">${remarcados}</div><div class="c-label">Remarcados</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#f87171">${faltou}</div><div class="c-label">Faltou</div></div>
  </div>`;

  // Filters + add button
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div class="filters" style="margin-bottom:0">
      ${['todos','agendado','realizado','remarcado','faltou'].map(s =>
        `<button class="filter-btn ${conselhoAgendaFilter === s ? 'active' : ''}" onclick="conselhoAgendaFilter='${s}';render()">${s === 'todos' ? 'Todos' : s.charAt(0).toUpperCase() + s.slice(1)}</button>`
      ).join('')}
    </div>
    <button class="btn btn-primary" onclick="openAgendamentoModal()">+ Novo Agendamento</button>
  </div>`;

  let filtered = conselhoAgendaFilter === 'todos' ? weekAgendas : weekAgendas.filter(a => a.status === conselhoAgendaFilter);
  filtered.sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="icon">&mdash;</div><p>Nenhum agendamento ${conselhoAgendaFilter !== 'todos' ? 'com esse status' : 'nesta semana'}.</p></div>`;
  } else {
    filtered.forEach(ag => {
      const cand = candidatos.find(c => c.id === ag.candidato_id);
      const dataFmt = ag.data ? new Date(ag.data + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }) : '—';
      html += `<div class="agenda-card">
        <div class="agenda-info">
          <div class="agenda-nome">${ag.nome_candidato || (cand ? cand.nome : 'Candidato')}</div>
          <div class="agenda-meta">
            <span>&bull; ${dataFmt} ${ag.hora || ''}</span>
            ${ag.instagram ? `<span>&bull; ${ag.instagram}</span>` : ''}
            ${ag.observacao ? `<span style="color:var(--text-muted);font-style:italic">${ag.observacao}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="agenda-status ag-${ag.status}">${ag.status}</span>
          ${ag.status === 'agendado' ? `<button class="btn btn-sm btn-success" onclick="marcarRealizado('${ag.id}')" style="font-size:11px">&check; Realizado</button>` : ''}
          <button class="task-action-btn" onclick="openEditAgendamentoModal('${ag.id}')" title="Editar">&starf;</button>
          <button class="task-action-btn" onclick="deleteAgendamento('${ag.id}')" title="Excluir">&times;</button>
        </div>
      </div>`;
    });
  }
  return html;
}

// ── 2. CANDIDATOS ──
function renderConselhoCandidatos() {
  const candidatos = loadConselhoCandidatos();
  let filtered = [...candidatos];

  if (conselhoCandFilter === 'A' || conselhoCandFilter === 'B' || conselhoCandFilter === 'C' || conselhoCandFilter === 'Crítico') {
    filtered = filtered.filter(c => c.classificacao === conselhoCandFilter);
  } else if (conselhoCandFilter === 'ativo' || conselhoCandFilter === 'inativo' || conselhoCandFilter === 'reagendar') {
    filtered = filtered.filter(c => c.status_geral === conselhoCandFilter);
  }

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div class="filters" style="margin-bottom:0">
      ${['todos','A','B','C','Crítico','ativo','inativo','reagendar'].map(s =>
        `<button class="filter-btn ${conselhoCandFilter === s ? 'active' : ''}" onclick="conselhoCandFilter='${s}';render()">${s === 'todos' ? 'Todos' : s}</button>`
      ).join('')}
    </div>
    <button class="btn btn-primary" onclick="openCandidatoModal()">+ Novo Candidato</button>
  </div>`;

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="icon">&mdash;</div><p>Nenhum candidato cadastrado.</p></div>`;
  } else {
    html += `<div style="overflow-x:auto"><table class="cand-table">
      <thead><tr>
        <th>Nome</th>
        <th>Instagram</th>
        <th>Cargo</th>
        <th>Classificação</th>
        <th>Nota</th>
        <th>Status</th>
        <th>Último Atend.</th>
        <th>Notas Mensais</th>
        <th></th>
      </tr></thead><tbody>`;

    filtered.forEach(c => {
      const notaCor = c.nota >= 4 ? '#4ade80' : c.nota >= 2.5 ? '#facc15' : '#f87171';
      const riskDot = c.classificacao === 'Crítico' ? 'risk-alto' : c.classificacao === 'C' ? 'risk-medio' : 'risk-baixo';

      const notasMensais = CONSELHO_MESES.map(m => {
        const val = c.notas_mensais && c.notas_mensais[m.id] !== undefined ? c.notas_mensais[m.id] : '—';
        return `<span style="font-size:11px;margin:0 2px;padding:1px 4px;border-radius:3px;background:var(--bg)">${val}</span>`;
      }).join('');

      html += `<tr>
        <td style="font-weight:600;color:var(--text)"><span class="risk-indicator ${riskDot}"></span>${c.nome}</td>
        <td>${c.instagram || '—'}</td>
        <td>${c.cargo || '—'}</td>
        <td><span class="classif-badge classif-${c.classificacao}">${c.classificacao}</span></td>
        <td><span class="nota-badge" style="background:${notaCor}22;color:${notaCor}">${c.nota}</span></td>
        <td><span style="font-size:11px;text-transform:uppercase;font-weight:600;color:${c.status_geral === 'ativo' ? '#4ade80' : c.status_geral === 'reagendar' ? '#facc15' : 'var(--text-muted)'}">${c.status_geral}</span></td>
        <td style="font-size:12px">${c.ultimo_atendimento || '—'}</td>
        <td>${notasMensais}</td>
        <td>
          <button class="task-action-btn" onclick="openEditCandidatoModal('${c.id}')" title="Editar">&starf;</button>
          <button class="task-action-btn" onclick="deleteCandidato('${c.id}')" title="Excluir">&times;</button>
        </td>
      </tr>`;
    });

    html += '</tbody></table></div>';
  }
  return html;
}

// ── 3. ACOMPANHAMENTO MENSAL ──
function renderConselhoAcompanhamento() {
  const candidatos = loadConselhoCandidatos().filter(c => c.status_geral === 'ativo');
  const acompanhamentos = loadConselhoAcompanhamentos();

  let html = '<div class="acomp-month-nav">';
  CONSELHO_MESES.forEach(m => {
    html += `<button class="acomp-month-btn ${conselhoMesAtual === m.id ? 'active' : ''}" onclick="conselhoMesAtual='${m.id}';render()">${m.label}</button>`;
  });
  html += '</div>';

  if (candidatos.length === 0) {
    html += `<div class="empty-state"><div class="icon">&mdash;</div><p>Cadastre candidatos ativos primeiro.</p></div>`;
    return html;
  }

  html += `<div style="overflow-x:auto"><table class="cand-table">
    <thead><tr>
      <th>Candidato</th>
      <th>Implementou Ajustes</th>
      <th>Nota</th>
      <th>Classificação</th>
      <th>Comprometimento</th>
      <th>Risco Político</th>
      <th>Compromissos</th>
      <th>Observações</th>
      <th></th>
    </tr></thead><tbody>`;

  candidatos.forEach(c => {
    const ac = acompanhamentos.find(a => a.candidato_id === c.id && a.mes === conselhoMesAtual) || {};

    const implCor = ac.implementou === 'sim' ? '#4ade80' : ac.implementou === 'parcialmente' ? '#facc15' : ac.implementou === 'não' ? '#f87171' : 'var(--text-muted)';
    const compCor = ac.comprometimento === 'alto' ? '#4ade80' : ac.comprometimento === 'medio' ? '#facc15' : ac.comprometimento === 'baixo' ? '#f87171' : 'var(--text-muted)';
    const riskDot = ac.risco === 'alto' ? 'risk-alto' : ac.risco === 'medio' ? 'risk-medio' : 'risk-baixo';

    html += `<tr>
      <td style="font-weight:600;color:var(--text)">${c.nome}</td>
      <td><span style="color:${implCor};font-weight:600;font-size:12px;text-transform:uppercase">${ac.implementou || '—'}</span></td>
      <td>${ac.nota !== undefined ? `<span class="nota-badge" style="background:${ac.nota >= 4 ? '#4ade8022' : ac.nota >= 2.5 ? '#facc1522' : '#f8717122'};color:${ac.nota >= 4 ? '#4ade80' : ac.nota >= 2.5 ? '#facc15' : '#f87171'}">${ac.nota}</span>` : '—'}</td>
      <td>${ac.classificacao ? `<span class="classif-badge classif-${ac.classificacao}">${ac.classificacao}</span>` : '—'}</td>
      <td><span style="color:${compCor};font-weight:600;font-size:12px;text-transform:uppercase">${ac.comprometimento || '—'}</span></td>
      <td><span class="risk-indicator ${riskDot}"></span><span style="font-size:12px;text-transform:uppercase">${ac.risco || 'baixo'}</span></td>
      <td style="font-size:12px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(ac.compromissos || '').replace(/"/g,'&quot;')}">${ac.compromissos || '—'}</td>
      <td style="font-size:12px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(ac.observacoes || '').replace(/"/g,'&quot;')}">${ac.observacoes || '—'}</td>
      <td><button class="btn btn-sm" onclick="openAcompanhamentoModal('${c.id}','${conselhoMesAtual}')" style="font-size:11px">&starf;</button></td>
    </tr>`;
  });

  html += '</tbody></table></div>';

  // Comparativo de notas
  html += `<div class="relatorio-box" style="margin-top:20px">
    <h3>Evolu&ccedil;&atilde;o de Notas</h3>
    <div style="overflow-x:auto"><table class="cand-table">
      <thead><tr><th>Candidato</th>${CONSELHO_MESES.map(m => `<th style="text-align:center">${m.label}</th>`).join('')}</tr></thead>
      <tbody>`;

  candidatos.forEach(c => {
    html += `<tr><td style="font-weight:600;color:var(--text)">${c.nome}</td>`;
    CONSELHO_MESES.forEach(m => {
      const ac = acompanhamentos.find(a => a.candidato_id === c.id && a.mes === m.id);
      const nota = ac ? ac.nota : (c.notas_mensais && c.notas_mensais[m.id] !== undefined ? c.notas_mensais[m.id] : '—');
      const cor = nota !== '—' && nota >= 4 ? '#4ade80' : nota >= 2.5 ? '#facc15' : nota !== '—' ? '#f87171' : 'var(--text-muted)';
      html += `<td style="text-align:center"><span style="font-weight:700;color:${cor}">${nota}</span></td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div></div>';
  return html;
}

// ── 4. TAREFAS DA OPERAÇÃO ──
function renderConselhoTarefas() {
  const tasks = getTasksForEmpresa('partido_novo');

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div class="filters" style="margin-bottom:0">
      ${['todos','pendente','em_andamento','concluido'].map(s =>
        `<button class="filter-btn ${statusFilter === s ? 'active' : ''}" onclick="setFilter('${s}')">${s === 'todos' ? 'Todos' : statusLabel(s)}</button>`
      ).join('')}
    </div>
    <button class="btn btn-primary" onclick="openTaskModal('partido_novo')">+ Nova Tarefa</button>
  </div>`;

  const filtered = statusFilter === 'todos' ? tasks : tasks.filter(t => t.status === statusFilter);

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="icon">&mdash;</div><p>Nenhuma tarefa operacional nesta semana.</p></div>`;
  } else {
    const groups = { pendente: [], em_andamento: [], bloqueado: [], concluido: [] };
    filtered.forEach(t => { if (groups[t.status]) groups[t.status].push(t); });

    Object.entries(groups).forEach(([status, items]) => {
      if (items.length === 0) return;
      html += `<div class="task-group">
        <div class="task-group-header">${statusLabel(status)} <span class="task-count">${items.length}</span></div>
        ${items.map(t => renderTaskItem(t, true)).join('')}
      </div>`;
    });
  }
  return html;
}

// ── 5. RELATÓRIO AO DIRETÓRIO ──
function renderConselhoRelatorio() {
  const candidatos = loadConselhoCandidatos();
  const acompanhamentos = loadConselhoAcompanhamentos();

  const ativos = candidatos.filter(c => c.status_geral === 'ativo');
  const classifA = candidatos.filter(c => c.classificacao === 'A').length;
  const classifB = candidatos.filter(c => c.classificacao === 'B').length;
  const classifC = candidatos.filter(c => c.classificacao === 'C').length;
  const classifCrit = candidatos.filter(c => c.classificacao === 'Crítico').length;

  const top5 = [...candidatos].sort((a, b) => (b.nota || 0) - (a.nota || 0)).slice(0, 5);
  const criticos = candidatos.filter(c => c.classificacao === 'Crítico' || acompanhamentos.some(a => a.candidato_id === c.id && a.risco === 'alto'));

  // Load saved report text
  const savedReport = JSON.parse(localStorage.getItem('conselho_relatorio') || '{}');

  let html = '';

  // Counters
  html += `<div class="conselho-counter-row">
    <div class="conselho-counter"><div class="c-val" style="color:#4ade80">${ativos.length}</div><div class="c-label">Candidatos Ativos</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#4ade80">${classifA}</div><div class="c-label">Classificação A</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#60a5fa">${classifB}</div><div class="c-label">Classificação B</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#facc15">${classifC}</div><div class="c-label">Classificação C</div></div>
    <div class="conselho-counter"><div class="c-val" style="color:#f87171">${classifCrit}</div><div class="c-label">Crítico</div></div>
  </div>`;

  // Top 5
  html += `<div class="relatorio-box">
    <h3>Top 5 — Maior Nota</h3>
    ${top5.length > 0 ? top5.map((c, i) => `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:16px;font-weight:800;color:var(--text-muted);width:24px">${i + 1}.</span>
      <span style="flex:1;font-weight:600">${c.nome}</span>
      <span class="classif-badge classif-${c.classificacao}">${c.classificacao}</span>
      <span class="nota-badge" style="background:${c.nota >= 4 ? '#4ade8022' : '#facc1522'};color:${c.nota >= 4 ? '#4ade80' : '#facc15'}">${c.nota}</span>
    </div>`).join('') : '<p style="color:var(--text-muted);font-size:13px">Nenhum candidato cadastrado.</p>'}
  </div>`;

  // Críticos
  if (criticos.length > 0) {
    html += `<div class="relatorio-box" style="border-color:rgba(239,68,68,0.3)">
      <h3 style="color:#f87171">&loz; Candidatos em Situação Crítica</h3>
      ${criticos.map(c => {
        const acMes = acompanhamentos.filter(a => a.candidato_id === c.id).slice(-1)[0];
        return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="flex:1;font-weight:600;color:#f87171">${c.nome}</span>
          <span style="font-size:12px;color:var(--text-muted)">${c.cargo || ''}</span>
          <span class="classif-badge classif-${c.classificacao}">${c.classificacao}</span>
          ${acMes && acMes.risco === 'alto' ? '<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(239,68,68,0.15);color:#f87171;font-weight:700">RISCO ALTO</span>' : ''}
        </div>`;
      }).join('')}
    </div>`;
  }

  // Text fields
  html += `<div class="relatorio-box">
    <h3>Diretrizes Gerais do Mês</h3>
    <textarea class="form-textarea" id="relDiretrizes" placeholder="Diretrizes gerais do mês..." style="min-height:100px" onchange="saveRelatorioField('diretrizes', this.value)">${savedReport.diretrizes || ''}</textarea>
  </div>`;

  html += `<div class="relatorio-box">
    <h3>Alertas Estratégicos</h3>
    <textarea class="form-textarea" id="relAlertas" placeholder="Alertas estratégicos..." style="min-height:100px" onchange="saveRelatorioField('alertas', this.value)">${savedReport.alertas || ''}</textarea>
  </div>`;

  // Export button
  html += `<div style="text-align:center;margin-top:20px">
    <button class="btn btn-primary" onclick="exportRelatorio()" style="font-size:14px;padding:12px 32px">Exportar Relat&oacute;rio</button>
  </div>`;

  return html;
}

function saveRelatorioField(field, value) {
  const saved = JSON.parse(localStorage.getItem('conselho_relatorio') || '{}');
  saved[field] = value;
  localStorage.setItem('conselho_relatorio', JSON.stringify(saved));
}

function exportRelatorio() {
  const candidatos = loadConselhoCandidatos();
  const acompanhamentos = loadConselhoAcompanhamentos();
  const saved = JSON.parse(localStorage.getItem('conselho_relatorio') || '{}');

  const ativos = candidatos.filter(c => c.status_geral === 'ativo');
  const classifA = candidatos.filter(c => c.classificacao === 'A').length;
  const classifB = candidatos.filter(c => c.classificacao === 'B').length;
  const classifC = candidatos.filter(c => c.classificacao === 'C').length;
  const classifCrit = candidatos.filter(c => c.classificacao === 'Crítico').length;

  const top5 = [...candidatos].sort((a, b) => (b.nota || 0) - (a.nota || 0)).slice(0, 5);
  const criticos = candidatos.filter(c => c.classificacao === 'Crítico');

  let text = `═══════════════════════════════════════\n`;
  text += `RELATÓRIO — CONSELHO DIGITAL NOVO DF\n`;
  text += `Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
  text += `═══════════════════════════════════════\n\n`;

  text += `▸ CANDIDATOS ATIVOS: ${ativos.length}\n`;
  text += `▸ DISTRIBUIÇÃO: A(${classifA}) | B(${classifB}) | C(${classifC}) | Crítico(${classifCrit})\n\n`;

  text += `── TOP 5 CANDIDATOS ──\n`;
  top5.forEach((c, i) => { text += `  ${i + 1}. ${c.nome} — Nota: ${c.nota} | ${c.classificacao}\n`; });

  if (criticos.length > 0) {
    text += `\n── SITUAÇÃO CRÍTICA ──\n`;
    criticos.forEach(c => { text += `  &loz; ${c.nome} — ${c.cargo || 'Cargo não definido'}\n`; });
  }

  if (saved.diretrizes) {
    text += `\n── DIRETRIZES GERAIS ──\n${saved.diretrizes}\n`;
  }
  if (saved.alertas) {
    text += `\n── ALERTAS ESTRATÉGICOS ──\n${saved.alertas}\n`;
  }

  text += `\n═══════════════════════════════════════\n`;
  text += `Gerado automaticamente pelo Sistema ÁGUIA\n`;

  navigator.clipboard.writeText(text).then(() => toast('Relatório copiado para a área de transferência!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('Relatório copiado!');
  });
}

// ── Agendamentos ──
function openAgendamentoModal(editId) {
  const candidatos = loadConselhoCandidatos();
  const agendamentos = loadConselhoAgendamentos();
  const editing = editId ? agendamentos.find(a => a.id === editId) : null;

  const candOptions = candidatos.map(c =>
    `<option value="${c.id}" ${editing && editing.candidato_id === c.id ? 'selected' : ''}>${c.nome}</option>`
  ).join('');

  showModal(editing ? 'Editar Agendamento' : 'Novo Agendamento', `
    <div class="form-group">
      <label class="form-label">Nome do Candidato</label>
      <input class="form-input" id="agNome" value="${editing ? (editing.nome_candidato || '') : ''}" placeholder="Nome do candidato">
    </div>
    ${candidatos.length > 0 ? `<div class="form-group">
      <label class="form-label">Vincular a Candidato (opcional)</label>
      <select class="form-select" id="agCandidato"><option value="">— Não vincular —</option>${candOptions}</select>
    </div>` : ''}
    <div class="form-group">
      <label class="form-label">Data</label>
      <input class="form-input" type="date" id="agData" value="${editing ? editing.data : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">Horário</label>
      <input class="form-input" type="time" id="agHora" value="${editing ? editing.hora : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select class="form-select" id="agStatus">
        ${['agendado','realizado','remarcado','faltou'].map(s =>
          `<option value="${s}" ${editing && editing.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`
        ).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Instagram / Rede Principal</label>
      <input class="form-input" id="agInsta" value="${editing ? (editing.instagram || '') : ''}" placeholder="@usuario">
    </div>
    <div class="form-group">
      <label class="form-label">Observação</label>
      <textarea class="form-textarea" id="agObs" placeholder="Observação rápida...">${editing ? (editing.observacao || '') : ''}</textarea>
    </div>
  `, [
    { label: 'Cancelar', class: 'btn', action: 'closeModal()' },
    { label: editing ? 'Salvar' : 'Criar', class: 'btn btn-primary', action: editing ? `saveEditAgendamento('${editId}')` : 'saveAgendamento()' },
  ]);
}

function openEditAgendamentoModal(id) { openAgendamentoModal(id); }

function saveAgendamento() {
  const nome = document.getElementById('agNome').value.trim();
  if (!nome) return toast('Nome obrigatório', 'error');

  const agendamentos = loadConselhoAgendamentos();
  const candEl = document.getElementById('agCandidato');

  agendamentos.push({
    id: uuid(),
    candidato_id: candEl ? candEl.value : '',
    nome_candidato: nome,
    data: document.getElementById('agData').value,
    hora: document.getElementById('agHora').value,
    status: document.getElementById('agStatus').value,
    instagram: document.getElementById('agInsta').value.trim(),
    observacao: document.getElementById('agObs').value.trim(),
    semana: DATA.currentWeek,
  });

  saveConselhoAgendamentos(agendamentos);
  closeModal();
  render();
  toast('Agendamento criado');
}

function saveEditAgendamento(id) {
  const agendamentos = loadConselhoAgendamentos();
  const ag = agendamentos.find(a => a.id === id);
  if (!ag) return;

  ag.nome_candidato = document.getElementById('agNome').value.trim();
  const candEl = document.getElementById('agCandidato');
  if (candEl) ag.candidato_id = candEl.value;
  ag.data = document.getElementById('agData').value;
  ag.hora = document.getElementById('agHora').value;
  ag.status = document.getElementById('agStatus').value;
  ag.instagram = document.getElementById('agInsta').value.trim();
  ag.observacao = document.getElementById('agObs').value.trim();

  saveConselhoAgendamentos(agendamentos);
  closeModal();
  render();
  toast('Agendamento atualizado');
}

function marcarRealizado(id) {
  const agendamentos = loadConselhoAgendamentos();
  const ag = agendamentos.find(a => a.id === id);
  if (ag) {
    ag.status = 'realizado';
    saveConselhoAgendamentos(agendamentos);
    render();
    toast('Marcado como realizado');
  }
}

function deleteAgendamento(id) {
  if (!confirm('Excluir este agendamento?')) return;
  const agendamentos = loadConselhoAgendamentos().filter(a => a.id !== id);
  saveConselhoAgendamentos(agendamentos);
  render();
  toast('Agendamento excluído');
}

function openEditCandidatoModal(id) { openCandidatoModal(id); }

function getCandidatoFormData() {
  const nome = document.getElementById('candNome').value.trim();
  if (!nome) { toast('Nome obrigatório', 'error'); return null; }

  const notas_mensais = {};
  CONSELHO_MESES.forEach(m => {
    const val = document.getElementById('candNota_' + m.id).value;
    if (val !== '') notas_mensais[m.id] = parseFloat(val);
  });

  return {
    nome,
    instagram: document.getElementById('candInsta').value.trim(),
    cargo: document.getElementById('candCargo').value.trim(),
    classificacao: document.getElementById('candClassif').value,
    nota: parseFloat(document.getElementById('candNota').value) || 0,
    status_geral: document.getElementById('candStatus').value,
    ultimo_atendimento: document.getElementById('candUltimoAtend').value.trim(),
    notas_mensais,
  };
}

function saveCandidato() {
  const data = getCandidatoFormData();
  if (!data) return;

  const candidatos = loadConselhoCandidatos();
  candidatos.push({ id: uuid(), ...data });
  saveConselhoCandidatos(candidatos);
  closeModal();
  render();
  toast('Candidato cadastrado');
}

function saveEditCandidato(id) {

  candidatos[idx] = { ...candidatos[idx], ...data };
  saveConselhoCandidatos(candidatos);
  closeModal();
  render();
  toast('Candidato atualizado');
}

function deleteCandidato(id) {

        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label">Comprometimento</label>
        <select class="form-select" id="acComp">
          ${['','alto','medio','baixo'].map(s => `<option value="${s}" ${existing.comprometimento === s ? 'selected' : ''}>${s || '— Selecionar —'}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Risco Político Digital</label>
        <select class="form-select" id="acRisco">
          ${['baixo','medio','alto'].map(s => `<option value="${s}" ${existing.risco === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Compromissos Assumidos</label>
      <textarea class="form-textarea" id="acCompromissos" placeholder="Compromissos assumidos pelo candidato...">${existing.compromissos || ''}</textarea>
    </div>

      <label class="form-label">Observações Internas</label>
      <textarea class="form-textarea" id="acObs" placeholder="Observações internas...">${existing.observacoes || ''}</textarea>
    </div>
  `, [
    { label: 'Cancelar', class: 'btn', action: 'closeModal()' },
    { label: 'Salvar', class: 'btn btn-primary', action: `saveAcompanhamento('${candidatoId}','${mes}')` },
  ]);
}

function saveAcompanhamento(candidatoId, mes) {
  const acompanhamentos = loadConselhoAcompanhamentos();
  const idx = acompanhamentos.findIndex(a => a.candidato_id === candidatoId && a.mes === mes);

  const data = {
    id: idx >= 0 ? acompanhamentos[idx].id : uuid(),
    candidato_id: candidatoId,
    mes,
    implementou: document.getElementById('acImpl').value,
    nota: document.getElementById('acNota').value !== '' ? parseFloat(document.getElementById('acNota').value) : undefined,
    classificacao: document.getElementById('acClassif').value,
    comprometimento: document.getElementById('acComp').value,
    risco: document.getElementById('acRisco').value,
    compromissos: document.getElementById('acCompromissos').value.trim(),
    observacoes: document.getElementById('acObs').value.trim(),
  };

  if (idx >= 0) {
    acompanhamentos[idx] = data;
  } else {
    acompanhamentos.push(data);
  }

  saveConselhoAcompanhamentos(acompanhamentos);

  // Also update the nota mensal on the candidate
  const candidatos = loadConselhoCandidatos();
  const cand = candidatos.find(c => c.id === candidatoId);
  if (cand && data.nota !== undefined) {
    if (!cand.notas_mensais) cand.notas_mensais = {};
    cand.notas_mensais[mes] = data.nota;
    if (data.classificacao) cand.classificacao = data.classificacao;
    cand.nota = data.nota;
    saveConselhoCandidatos(candidatos);
  }

  closeModal();
  render();
  toast('Acompanhamento salvo');
}

  const data = {

  const idx = HALO_FUNNEL.indexOf(c.funil);

  saveHaloClientes(clientes);
  render();

function toggleTask(id) {
  const task = DATA.tarefas.find(t => t.id === id);
  if (!task) return;
  if (task.status === 'concluido') {
    task.status = 'pendente';
    task.concluido_em = null;
  } else {
    task.status = 'concluido';
    task.concluido_em = new Date().toISOString().slice(0, 10);
  }
  saveData(DATA);
  render();
}

function cycleStatus(id) {
  const task = DATA.tarefas.find(t => t.id === id);
  if (!task) return;
  const order = ['pendente', 'em_andamento', 'bloqueado', 'concluido'];
  const idx = order.indexOf(task.status);
  task.status = order[(idx + 1) % order.length];
  task.concluido_em = task.status === 'concluido' ? new Date().toISOString().slice(0, 10) : null;
  saveData(DATA);
  render();
  toast(`Status: ${statusLabel(task.status)}`);
}

function deleteTask(id) {
  if (!confirm('Excluir esta tarefa?')) return;
  DATA.tarefas = DATA.tarefas.filter(t => t.id !== id);

  render();
  toast('Tarefa excluída');
}

// ── Week Management ──
function openNewWeekModal() {
  const nextWeek = getNextWeekId();
  showModal('Nova Semana', `
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">
      Criar semana <strong>${nextWeek}</strong> (${getWeekDates(nextWeek)})?<br><br>
      Tarefas pendentes da semana atual serão carregadas automaticamente com o contador de semanas incrementado.
    </p>
  `, [
    { label: 'Cancelar', class: 'btn', action: 'closeModal()' },
    { label: 'Criar Semana', class: 'btn btn-primary', action: `createNewWeek('${nextWeek}')` },
  ]);
}

function getNextWeekId() {
  const current = DATA.currentWeek;
  const [year, w] = current.split('-W').map(Number);
  const nextW = w + 1;
  if (nextW > 52) return `${year + 1}-W01`;
  return `${year}-W${String(nextW).padStart(2, '0')}`;
}

function createNewWeek(weekId) {
  // Check if week already exists
  if (DATA.semanas.find(s => s.id === weekId)) {
    DATA.currentWeek = weekId;
    saveData(DATA);
    closeModal();
    render();
    return;
  }

  // Create new week
  DATA.semanas.push({
    id: weekId,
    label: getWeekDates(weekId),
    fechada: false,
    diagnostico: '',
  });

  // Carry over pending tasks
  const pendingTasks = DATA.tarefas.filter(t => t.semana === DATA.currentWeek && t.status !== 'concluido');
  pendingTasks.forEach(t => {
    DATA.tarefas.push({
      id: uuid(),
      empresa_id: t.empresa_id,
      titulo: t.titulo,
      status: 'pendente',
      semana: weekId,
      observacao: t.observacao,
      criado_em: new Date().toISOString().slice(0, 10),
      concluido_em: null,
      semanas_acumuladas: t.semanas_acumuladas + 1,
    });
  });

  DATA.currentWeek = weekId;
  saveData(DATA);
  closeModal();
  render();
  toast(`Semana ${weekId} criada com ${pendingTasks.length} pendências carregadas`);
}

function closeWeek() {
  const week = DATA.semanas.find(s => s.id === DATA.currentWeek);
  if (!week) return;

  const tasks = getTasksForWeek(DATA.currentWeek);
  const done = tasks.filter(t => t.status === 'concluido').length;
  const pending = tasks.length - done;

  showModal('Fechar Semana', `
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">
      Fechar a semana <strong>${DATA.currentWeek}</strong>?<br><br>
      <span style="color:#4ade80">${done} concluídas</span> · <span style="color:#facc15">${pending} pendentes</span><br><br>
      As pendências serão carregadas na próxima semana automaticamente.
    </p>
  `, [
    { label: 'Cancelar', class: 'btn', action: 'closeModal()' },
    { label: 'Fechar e Criar Próxima', class: 'btn btn-success', action: 'confirmCloseWeek()' },
  ]);
}

function confirmCloseWeek() {
  const week = DATA.semanas.find(s => s.id === DATA.currentWeek);
  if (week) week.fechada = true;

  const nextWeek = getNextWeekId();
  createNewWeek(nextWeek);
  toast('Semana fechada');
}

// ── Export/Import ──
function exportJSON() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aguia_backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.tarefas && imported.semanas) {
        DATA = imported;
        saveData(DATA);
        render();
        toast('Backup importado');
      } else {
        toast('Arquivo inválido', 'error');
      }
    } catch {
      toast('Erro ao importar', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Modal System ──
function showModal(title, body, buttons) {
  const existing = document.getElementById('modalOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'modalOverlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal fade-in">
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        ${buttons.map(b => `<button class="${b.class}" onclick="${b.action}">${b.label}</button>`).join('')}
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.remove();
}

// REAL-TIME SYNC — listen for changes from other devices
(function setupRealtimeSync() {
  try {
    db.collection('data').onSnapshot((snapshot) => {
      if (syncInProgress) return;
      if (!cloudSyncReady) return; // wait for initial sync
      let needsRender = false;
      snapshot.docChanges().forEach(change => {
        if (change.type === 'modified' || change.type === 'added') {
          const key = change.doc.id;
          const cloudData = change.doc.data();

          // CRITICAL: skip our own writes by device_id
          if (cloudData.device_id === DEVICE_ID) return;

          const localTs = getSyncTimestamps()[key] || 0;
          const cloudTs = cloudData.updated_at ? new Date(cloudData.updated_at).getTime() : 0;

          // Apply if cloud is newer (from another device)
          if (cloudTs > localTs) {
            const val = typeof cloudData.value === 'string' ? cloudData.value : JSON.stringify(cloudData.value);
            _origSetItem(key, val);
            const ts = getSyncTimestamps();
            ts[key] = cloudTs;
            _origSetItem(SYNC_TIMESTAMPS_KEY, JSON.stringify(ts));

            if (key === STORAGE_KEY) {
              try { DATA = JSON.parse(val); } catch(e) {}
              needsRender = true;
            }
          }
        }
      });
      if (needsRender) {
        render();
        toast('Sincronizado de outro dispositivo');
      }
    });
  } catch(e) {
    console.warn('Real-time sync not available:', e);
  }
})();
